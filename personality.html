<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personality Test | KME Recommender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-100 text-slate-800">
  <header class="topbar">
    <a class="brand" href="index.html"><span>KME Recommender<small>Find your next course</small></span></a>
    <div class="topbar-actions">
      <nav aria-label="Main">
        <a data-step="1" href="input.html">Profile</a>
        <a class="active" data-step="2" href="personality.html">Personality</a>
        <a data-step="3" href="result.html">Results</a>
      </nav>
      <div class="nav-auth" id="navAuth" aria-label="Account"></div>
    </div>
  </header>

  <main class="page">
    <section class="page-heading">
      <p class="eyebrow">Step 2 of 3</p>
      <h1>RIASEC flashcards.</h1>
      <p>One statement at a time — like a short MBTI-style check-in. Tap how much each line sounds like you, then continue.</p>
      <div class="stepper" aria-label="Recommendation progress">
        <span>1 Profile</span>
        <span class="active">2 Personality</span>
        <span>3 Results</span>
      </div>
    </section>

    <form id="personalityForm" class="form-shell flashcard-form">
      <div class="flashcard-root" id="flashcardRoot">
        <div class="flashcard-top">
          <span id="flashcardCounter" class="flashcard-counter" aria-live="polite">1 / 10</span>
          <div class="flashcard-progress-track" aria-hidden="true">
            <span id="flashcardProgressFill" class="flashcard-progress-fill"></span>
          </div>
        </div>

        <div id="flashcardViewport" class="flashcard-viewport">
          <div id="questionList" class="flashcard-stack"></div>
        </div>

        <p id="flashcardError" class="form-message flashcard-error" role="alert"></p>

        <div class="flashcard-nav">
          <button type="button" id="flashcardPrev" class="button ghost">Previous</button>
          <div id="flashcardDots" class="flashcard-dots" aria-label="Question dots"></div>
          <button type="button" id="flashcardNext" class="button primary">Continue</button>
        </div>
      </div>

      <div class="form-actions">
        <a class="button ghost" href="input.html">Exit to profile</a>
      </div>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
