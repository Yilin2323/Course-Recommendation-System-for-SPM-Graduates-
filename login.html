<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | KME Recommender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-100 text-slate-800">
  <header class="topbar">
    <a class="brand" href="landing.html"><span>KME Recommender<small>SPM course ideas</small></span></a>
    <div class="topbar-actions topbar-actions--public">
      <div class="nav-auth" id="navAuth" aria-label="Account"></div>
    </div>
  </header>

  <main class="page">
    <section class="page-heading">
      <p class="eyebrow">Account</p>
      <h1>Welcome back.</h1>
      <p>Log in to open the recommender home. This demo stores accounts in your browser only.</p>
    </section>

    <form id="loginForm" class="form-shell auth-form" autocomplete="on">
      <div id="loginMessage" class="form-message" role="alert"></div>
      <section class="form-section">
        <div class="form-section-header">
          <div>
            <h2>Log in</h2>
            <p class="section-note">Do not use a real password — this is a student prototype.</p>
          </div>
        </div>
        <div class="grid two">
          <label>
            Email
            <input id="loginEmail" name="email" type="email" placeholder="you@example.com" required autocomplete="username">
          </label>
          <label>
            Password
            <input name="password" type="password" placeholder="Your password" required autocomplete="current-password">
          </label>
        </div>
      </section>
      <div class="form-actions">
        <a class="button ghost" href="landing.html">Back to landing</a>
        <button class="button primary" type="submit">Log in</button>
      </div>
      <p class="auth-switch">No account? <a href="register.html">Create one</a></p>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
