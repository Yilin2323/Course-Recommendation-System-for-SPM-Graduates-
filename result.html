<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommendation Result | KME Recommender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-100 text-slate-800">
  <header class="topbar">
    <a class="brand" href="index.html"><span>KME Recommender<small>Find your next course</small></span></a>
    <div class="topbar-actions">
      <nav aria-label="Main">
        <a data-step="1" href="input.html">Profile</a>
        <a data-step="2" href="personality.html">Personality</a>
        <a class="active" data-step="3" href="result.html">Results</a>
      </nav>
      <div class="nav-auth" id="navAuth" aria-label="Account"></div>
    </div>
  </header>

  <main class="page">
    <section class="page-heading">
      <p class="eyebrow">Step 3 of 3</p>
      <h1>Your best-matched programmes.</h1>
      <p id="resultIntro">Complete your profile and personality check to unlock knowledge-based recommendations.</p>
      <div class="stepper" aria-label="Recommendation progress">
        <span>1 Profile</span>
        <span>2 Personality</span>
        <span class="active">3 Results</span>
      </div>
    </section>

    <section id="recommendationList" class="course-list course-list--results" aria-label="Ranked course recommendations"></section>

    <div class="form-actions">
      <a class="button ghost" href="personality.html">Edit Personality</a>
      <a class="button primary" href="input.html">Start Again</a>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
